<text x="362" y="160" font-size="10" fill="#52514e" text-anchor="middle">5,5</text>
<text x="138" y="412" font-size="13" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="96" y="367" font-size="13" fill="#0b0b0b" text-anchor="end">1</text>
<text x="194" y="412" font-size="13" fill="#0b0b0b" text-anchor="middle">2</text>
<text x="96" y="311" font-size="13" fill="#0b0b0b" text-anchor="end">2</text>
<text x="250" y="412" font-size="13" fill="#0b0b0b" text-anchor="middle">3</text>
<text x="96" y="255" font-size="13" fill="#0b0b0b" text-anchor="end">3</text>
<text x="306" y="412" font-size="13" fill="#0b0b0b" text-anchor="middle">4</text>
<text x="96" y="199" font-size="13" fill="#0b0b0b" text-anchor="end">4</text>
<text x="362" y="412" font-size="13" fill="#0b0b0b" text-anchor="middle">5</text>
<text x="96" y="143" font-size="13" fill="#0b0b0b" text-anchor="end">5</text>
<text x="250" y="436" font-size="13" fill="#52514e" text-anchor="middle">year of hit 1</text>
<text transform="translate(66 250) rotate(-90)" font-size="13" fill="#52514e" text-anchor="middle">year of hit 2</text>
<text x="440" y="130" font-size="13" fill="#0b0b0b" font-weight="600">5 × 5 = 25 pairs in the square</text>
<text x="440" y="152" font-size="13" fill="#0b0b0b"></text>
<text x="440" y="174" font-size="13" fill="#2a78d6" font-weight="600">● blue: hit 1 before hit 2 = 10  ✓ counts</text>
<text x="440" y="196" font-size="13" fill="#c8312b" font-weight="600">✕ red: hit 2 before hit 1 = 10  ✗ wrong order</text>
<text x="440" y="218" font-size="13" fill="#52514e" font-weight="600">gray: same year = 5  ✗ only 1 hit per year</text>
<text x="440" y="240" font-size="13" fill="#0b0b0b"></text>
<text x="440" y="262" font-size="13" fill="#0b0b0b">Blue and red are mirror images,</text>
<text x="440" y="284" font-size="13" fill="#0b0b0b">so blue is about half the square:</text>
<text x="440" y="306" font-size="13" fill="#0b0b0b">25 / 2 = 12.5  (formula, t² / 2!)</text>
<text x="440" y="328" font-size="13" fill="#0b0b0b">10 exactly  (the gray diagonal is why</text>
<text x="440" y="350" font-size="13" fill="#0b0b0b">it's a bit less than half)</text>
</svg>